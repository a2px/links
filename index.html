<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Links</title>
<meta name="description" content="A board of links worth keeping.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Links">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root {
    --tile: 104px;
    --radius: 24px;
    --gap-x: 40px;
    --gap-y: 28px;
    --ink: #1d1d1f;
    --muted: #86868b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  main { width: 100%; max-width: 1100px; margin: 0 auto; padding: 72px 48px 64px; flex: 1; }

  /* Search */
  .search { margin: 0 0 40px; max-width: 420px; position: relative; }
  .search input { width: 100%; border: 0; border-radius: 14px; background: #f4f4f6; padding: 12px 14px 12px 40px;
    font: inherit; font-size: 15px; color: var(--ink); outline: none; -webkit-appearance: none; appearance: none; }
  .search input:focus { box-shadow: 0 0 0 2px rgba(0,0,0,.14); background: #fff; }
  .search input::-webkit-search-cancel-button { -webkit-appearance: none; }
  .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
  .empty { color: var(--muted); font-size: 14px; }
  .item .where { font-size: 11px; color: var(--muted); margin-top: -6px; }

  /* Submit a link */
  .submit { width: 100%; max-width: 1100px; margin: 0 auto; padding: 0 48px 40px; }
  .submit form { background: #f4f4f6; border-radius: 20px; padding: 18px 18px 18px 22px;
    display: flex; align-items: center; gap: 14px; max-width: 560px; }
  .submit label { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .submit input#submit-url { flex: 1; min-width: 0; border: 0; background: #fff; border-radius: 12px;
    padding: 10px 12px; font: inherit; font-size: 14px; color: var(--ink); outline: none;
    box-shadow: 0 0 0 0.5px rgba(0,0,0,.10); }
  .submit input#submit-url:focus { box-shadow: 0 0 0 2px rgba(0,0,0,.18); }
  .submit button { border: 0; border-radius: 12px; padding: 10px 14px; font: inherit; font-size: 13px;
    font-weight: 600; background: var(--ink); color: #fff; cursor: pointer; }
  .submit button:disabled { opacity: .5; cursor: default; }
  .submit .note { font-size: 12.5px; color: var(--muted); margin: 10px 4px 0; min-height: 1em; }
  .submit .trap { position: absolute; left: -9999px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, var(--tile)); gap: var(--gap-y) var(--gap-x); justify-content: start; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 9px; width: var(--tile);
    text-decoration: none; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; font: inherit; }
  .icon { width: var(--tile); height: var(--tile); border-radius: var(--radius); overflow: hidden;
    background: #f2f2f4; box-shadow: 0 0 0 0.5px rgba(0,0,0,.08), 0 2px 8px rgba(0,0,0,.06);
    transition: transform .18s ease, box-shadow .18s ease; }
  .icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .item:hover .icon { transform: translateY(-2px); box-shadow: 0 0 0 0.5px rgba(0,0,0,.08), 0 8px 20px rgba(0,0,0,.10); }
  .item:active .icon { transform: scale(.96); }
  .label { font-size: 12.5px; line-height: 1.25; text-align: center; max-width: calc(var(--tile) + 24px);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .folder .icon { background: #ececf0; padding: 9px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; }
  .folder .icon span { border-radius: 9px; overflow: hidden; background: #dcdce2; aspect-ratio: 1; }
  .folder .icon span img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* Open folder */
  .scrim { position: fixed; inset: 0; background: rgba(255,255,255,.55); backdrop-filter: blur(22px) saturate(1.2);
    -webkit-backdrop-filter: blur(22px) saturate(1.2); display: none; align-items: center; justify-content: center; padding: 24px; z-index: 10; }
  .scrim.open { display: flex; animation: fade .18s ease; }
  .sheet { width: min(640px, 100%); max-height: 86vh; overflow: auto; }
  .sheet h2 { font-size: 28px; font-weight: 600; letter-spacing: -.01em; margin: 0 0 28px; text-align: center; }
  .panel { background: rgba(236,236,240,.85); border-radius: 36px; padding: 32px; }
  .panel .grid { justify-content: center; }
  @keyframes fade { from { opacity: 0; transform: scale(.98); } to { opacity: 1; transform: none; } }

  @media (max-width: 600px) {
    :root { --tile: 64px; --radius: 16px; --gap-x: 0px; --gap-y: 22px; }
    main { padding: 28px 18px 48px; }
    .search { margin-bottom: 28px; max-width: none; }
    .search input { font-size: 16px; }
    .submit { padding: 0 14px calc(20px + env(safe-area-inset-bottom)); }
    .submit form { flex-wrap: wrap; gap: 10px; padding: 16px; }
    .submit label { width: 100%; }
    .grid { grid-template-columns: repeat(4, 1fr); justify-items: center; }
    .label { font-size: 11px; max-width: 76px; }
    .folder .icon { padding: 6px; gap: 4px; }
    .folder .icon span { border-radius: 4px; }
    .panel { padding: 24px 12px; border-radius: 28px; }
    .sheet h2 { font-size: 22px; margin-bottom: 18px; }
    .item:hover .icon { transform: none; }
  }
</style>
</head>
<body>
<main>
  <div class="search">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
    <input type="search" id="search" placeholder="Search links" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search links">
  </div>
  <div class="grid" id="desk"></div>
  <p class="empty" id="no-results" hidden></p>
</main>
<footer class="submit">
  <form id="submit-form" autocomplete="off">
    <label for="submit-url">Submit a link</label>
    <input type="text" id="submit-url" name="url" placeholder="Paste a link" required inputmode="url" autocapitalize="off" spellcheck="false" maxlength="500">
    <input type="text" class="trap" name="website" tabindex="-1" aria-hidden="true">
    <button type="submit" id="submit-button">Submit</button>
  </form>
  <p class="note" id="submit-note"></p>
</footer>
<div class="scrim" id="scrim"><div class="sheet"><h2 id="folder-title"></h2><div class="panel"><div class="grid" id="folder-grid"></div></div></div></div>
<script>
const ORDER = ["Portfolios", "Studios", "Fonts", "Logos", "UI kits", "Mockups", "Inspiration", "Landing pages", "Companies", "Dev tools", "Analytics", "Documentation", "Accessibility", "Tools", "Articles", "Guides", "Notes", "Videos", "Events"];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function linkTile(l, showFolder) {
  return `<a class="item link" href="${esc(l.url)}" target="_blank" rel="noopener" title="${esc(l.name)}\n${esc(l.url)}" data-url="${esc(l.url)}">
    <div class="icon"><img src="${esc(l.image)}" alt="" loading="lazy"></div>
    <div class="label">${esc(l.name)}</div>${showFolder ? `<div class="label where">${esc(l.folder)}</div>` : ""}</a>`;
}
const desk = document.getElementById("desk"), search = document.getElementById("search"), noResults = document.getElementById("no-results");
let links = [], groups = {}, folderNames = [];
const fold = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
function showFolders() {
  desk.innerHTML = folderNames.map(n => `
    <button class="item folder" data-folder="${esc(n)}">
      <div class="icon">${groups[n].slice(0, 4).map(l => `<span><img src="${esc(l.image)}" alt="" loading="lazy"></span>`).join("")}</div>
      <div class="label">${esc(n)}</div></button>`).join("");
  desk.querySelectorAll(".folder").forEach(f => f.onclick = () => {
    const n = f.dataset.folder;
    document.getElementById("folder-title").textContent = n;
    document.getElementById("folder-grid").innerHTML = groups[n].map(l => linkTile(l)).join("");
    document.getElementById("scrim").classList.add("open");
  });
}
function render() {
  const words = fold(search.value).split(/\s+/).filter(Boolean);
  noResults.hidden = true;
  if (!words.length) return showFolders();
  const hits = links.filter(l => {
    const hay = fold([l.name, l.site, l.url, l.folder, l.source?.title, l.source?.description, l.source?.author].join(" "));
    return words.every(w => hay.includes(w));
  });
  desk.innerHTML = hits.map(l => linkTile(l, true)).join("");
  if (!hits.length) { noResults.textContent = `No links match "${search.value.trim()}".`; noResults.hidden = false; }
}
search.addEventListener("input", render);
search.addEventListener("keydown", e => { if (e.key === "Escape") { search.value = ""; render(); search.blur(); } });
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); search.focus(); }
});
fetch("links.json", {cache: "no-cache"}).then(r => r.json()).then(data => {
  links = data;
  links.forEach(l => (groups[l.folder] ||= []).push(l));
  folderNames = Object.keys(groups).sort((a, b) => (ORDER.indexOf(a) + 99 * (ORDER.indexOf(a) < 0)) - (ORDER.indexOf(b) + 99 * (ORDER.indexOf(b) < 0)));
  render();
});
const SUBMIT_TOPIC = "a2px-links-4afb6004d648";
const form = document.getElementById("submit-form"), note = document.getElementById("submit-note");
form.onsubmit = async e => {
  e.preventDefault();
  const input = form.url, button = document.getElementById("submit-button");
  if (form.website.value) return;
  let url = input.value.trim();
  if (!/^https?:\/\//i.test(url)) url = "https://" + url;
  try { if (!new URL(url).hostname.includes(".")) throw 0; } catch { note.textContent = "That doesn't look like a link. Check it and try again."; return; }
  button.disabled = true; note.textContent = "Submitting...";
  try {
    const r = await fetch("https://ntfy.sh/" + SUBMIT_TOPIC, { method: "POST", body: url });
    if (!r.ok) throw new Error(r.status);
    input.value = "";
    note.textContent = "Submitted. It shows up here once it's approved.";
  } catch {
    note.textContent = "Couldn't submit right now. Try again in a minute.";
  } finally { button.disabled = false; }
};
const scrim = document.getElementById("scrim");
scrim.onclick = e => { if (e.target === scrim || e.target.classList.contains("sheet")) scrim.classList.remove("open"); };
document.addEventListener("keydown", e => { if (e.key === "Escape") scrim.classList.remove("open"); });
</script>
</body>
</html>
