name: Add texted links

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: inbox
  cancel-in-progress: false

jobs:
  inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read new messages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: a2px-links-4afb6004d648
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scripts/telegram_inbox.py
      - name: Save changes
        run: |
          git config user.name "link-board"
          git config user.email "link-board@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update links"
            git pull --rebase --quiet && git push
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 4320000 ]; then
            # GitHub pauses scheduled runs after 60 quiet days; a commit every 50 keeps texting working.
            git commit --allow-empty -m "Keep the inbox running"
            git pull --rebase --quiet && git push
          fi
